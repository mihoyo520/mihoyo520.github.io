<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>WWZ Stream Player</title> 
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script> 
    <style> 
        body { 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #ffffff, #e0e0e0); 
            color: #333; 
        } 
 
        h1 { 
            margin-bottom: 20px; 
            font-size: 24px; 
            color: #4caf50; 
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3); 
        } 
 
        #player-container { 
            width: 90%; 
            max-width: 800px; 
            background: rgba(255, 255, 255, 0.8); 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2); 
            backdrop-filter: blur(10px); 
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; 
            opacity: 1; 
        } 
 
        #player-container.hidden { 
            transform: translateY(-20px); 
            opacity: 0; 
        } 
 
        video { 
            width: 100%; 
            height: auto; 
            outline: none; 
        } 
 
        #channel-toggle { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            padding: 12px 20px; 
            background: linear-gradient(135deg, #4caf50, #2e7d32); 
            color: #fff; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); 
            transition: background 0.3s ease, transform 0.2s ease; 
        } 
 
        #channel-toggle:hover { 
            background: linear-gradient(135deg, #2e7d32, #4caf50); 
            transform: scale(1.05); 
        } 
 
        #channel-menu { 
            position: fixed; 
            top: 80px; 
            right: 20px; 
            background: rgba(255, 255, 255, 0.9); 
            color: #333; 
            border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); 
            padding: 15px; 
            display: none; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 1000; 
            width: 250px; 
            backdrop-filter: blur(10px); 
            max-height: 60vh; 
            overflow-y: auto; 
        } 
 
        .channel-button { 
            padding: 12px 20px; 
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0); 
            color: #333; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            transition: background-color 0.3s ease, transform 0.2s ease; 
            text-align: center; 
        } 
 
        .channel-button:hover { 
            background: linear-gradient(135deg, #eeeeee, #dddddd); 
            transform: translateY(-3px); 
        } 
 
        .channel-button.active { 
            background: linear-gradient(135deg, #4caf50, #2e7d32); 
            color: #fff; 
        } 
 
        @media (max-width: 768px) { 
            #player-container { 
                width: 100%; 
            } 
 
            #channel-menu { 
                width: 200px; 
            } 
 
            #channel-toggle { 
                padding: 10px 15px; 
                font-size: 14px; 
            } 
 
            .channel-button { 
                padding: 10px 15px; 
                font-size: 12px; 
            } 
        } 
    </style> 
</head> 
<body> 
    <h1>WWZ Stream Player</h1> 
    <div id="player-container"> 
        <video id="video" controls autoplay></video> 
    </div> 
 
    <button id="channel-toggle">Channels</button> 
    <div id="channel-menu"> 
        <!-- Channel buttons will be dynamically added here --> 
    </div> 
 
    <script> 
        document.addEventListener('DOMContentLoaded', () => { 
            const video = document.getElementById('video'); 
            const playerContainer = document.getElementById('player-container'); 
            const channelMenu = document.getElementById('channel-menu'); 
            const channelToggle = document.getElementById('channel-toggle'); 
 
            // Array of channels 
            const channels = [ 
                { name: "影视1线", url: "https://stream.swagit.com/live-edge/houstontx/smil:hd-16x9-2-a/playlist.m3u8" },
                { name: "影视2线", url: "https://cdn-apse1-prod.tsv2.amagi.tv/linear/amg01076-lightningintern-petclub-samsungnz/playlist.m3u8" },
                { name: "影视3线",
url:"https://chlivemta1.akamaized.net/hls/live/2010556/mta3alarabia/playlist.m3u8" },
                { name: "影视4线", url: "https://live-uk.s4c-cdn.co.uk/out/v1/a0134f1fd5a2461b9422b574566d4442/live_uk.m3u8" },
                { name: "影视5线", url: "https://livemtaasia.akamaized.net/hls/live/2039224/mta6asia/playlist.m3u8" },
                { name: "影视6线", url: "http://albuk.dyndns.tv:1935/albuk/albuk.stream/playlist.m3u8" },
                { name: "影视7线", url: "https://live.streamingfast.net/osmflivech2.m3u8" },
                { name: "影视8线", url: "http://210.210.155.37/uq2663/h/h19/index.m3u8" },
                { name: "影视9线", url: "https://og2qd3aal7an-hls-live.5centscdn.com/garshomtv/d0dbe915091d400bd8ee7f27f0791303.sdp/playlist.m3u8" },
                { name: "影视10线", url: "https://ythls.armelin.one/channel/UCMbq0m2vILQTbc0VhOcVWaQ.m3u8" }
                
            ]; 
 
            let currentChannelIndex = 0; 
 
            // Function to play a channel 
            function playChannel(index) { 
                const channel = channels[index]; 
                if (!channel) return; 
 
                currentChannelIndex = index; 
 
                // Highlight active channel 
                document.querySelectorAll('.channel-button').forEach((button, idx) => { 
                    button.classList.toggle('active', idx === index); 
                }); 
 
                // Load video source 
                if (Hls.isSupported()) { 
                    const hls = new Hls(); 
                    hls.loadSource(channel.url); 
                    hls.attachMedia(video); 
                    hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                        video.play(); 
                    }); 
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) { 
                    video.src = channel.url; 
                    video.addEventListener('loadedmetadata', () => { 
                        video.play(); 
                    }); 
                } else { 
                    alert('Your browser does not support this video stream!'); 
                } 
 
                // Animate player container 
                playerContainer.classList.remove('hidden'); 
            } 
 
            // Generate channel buttons 
            channels.forEach((channel, index) => { 
                const button = document.createElement('button'); 
                button.textContent = channel.name; 
                button.className = 'channel-button'; 
                button.addEventListener('click', () => { 
                    playChannel(index); 
                    channelMenu.style.display = 'none'; 
                }); 
                channelMenu.appendChild(button); 
            }); 
 
            // Ensure scrollability for many channels 
            channelMenu.style.overflowY = 'auto'; 
 
            // Toggle channel menu visibility 
            channelToggle.addEventListener('click', () => { 
                channelMenu.style.display = channelMenu.style.display === 'none' || channelMenu.style.display === '' ? 'flex' : 'none'; 
            }); 
 
            // Play the first channel by default 
            playChannel(currentChannelIndex); 
        }); 
    </script> 
</body> 
</html>
